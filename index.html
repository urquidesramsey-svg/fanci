<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>翻词 · 英语复习</title><style>body{margin:0;background:#eff5ff;color:#17243d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:560px;margin:auto;padding:22px 18px 70px}h1{margin:10px 0 4px}small,.muted{color:#64748b}.panel{background:white;border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #1e40af12}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;background:#e8efff;color:#1745a5;cursor:pointer}button.primary{background:#2563eb;color:white}button.good{background:#dcfce7;color:#166534}button.bad{background:#fee2e2;color:#991b1b}button:disabled{opacity:.4}.card{height:250px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,#2563eb,#60a5fa);color:white;border-radius:22px;margin:16px 0;cursor:pointer;padding:18px;box-sizing:border-box;box-shadow:0 14px 24px #2563eb30}.card strong{font-size:32px;overflow-wrap:anywhere}.card p{opacity:.85}.stat{display:flex;justify-content:space-between;gap:8px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #dbe3f0;border-radius:12px;background:white;margin:5px 0 11px}label{font-size:13px;color:#64748b}nav{display:flex;gap:7px;margin-top:18px}nav button{flex:1}section[hidden]{display:none}.item{border-bottom:1px solid #e5eaf3;padding:12px 0}.item:last-child{border:0}.item b{font-size:17px}.item .row{margin-top:7px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17243d;color:white;padding:12px 18px;border-radius:12px;display:none;max-width:85vw}</style></head><body><main><h1>翻词 <span style="font-size:22px">🔄</span></h1><div class="muted">把学过的单词，变成每天的复习卡片。</div><nav><button onclick="tab('review')">翻卡复习</button><button onclick="tab('words')">单词库</button><button onclick="tab('manage')">添加 / 备份</button></nav><section id="review"><div class="panel"><div class="stat"><span id="progress">0 / 0</span><span id="count"></span></div><div class="row" style="margin-top:14px"><select id="mode" onchange="start()" style="width:auto;flex:1"><option value="zh">中文 → 英文</option><option value="en">英文 → 中文</option><option value="random">随机方向</option></select><select id="filter" onchange="start()" style="width:auto;flex:1"><option value="all">全部单词</option><option value="weak">只练薄弱词</option></select></div><div class="card" onclick="flip()"><div><strong id="face">点击开始</strong><p id="hint">点击卡片翻面</p></div></div><div class="row" style="justify-content:center"><button onclick="speak()">🔊 发音</button><button onclick="flip()">翻面</button><button onclick="start()">重新洗牌</button></div><div class="row" style="margin-top:14px"><button class="bad" style="flex:1" onclick="grade(false)">还不认识</button><button class="good" style="flex:1" onclick="grade(true)">记住了 ✓</button></div><p class="muted" style="font-size:13px">标记“不认识”的词会进入薄弱词库，可单独复习。所有数据保存在本机浏览器。</p></div></section><section id="words" hidden><div class="panel"><h2>我的单词库</h2><input id="search" placeholder="搜索中文或英文" oninput="renderList()"><div id="wordlist"></div></div></section><section id="manage" hidden><div class="panel"><h2>添加单词</h2><label>英文</label><input id="english" placeholder="例如：conduct"><label>中文</label><input id="chinese" placeholder="例如：进行；实施"><label>例句 / 备注（可选）</label><textarea id="note" rows="2" placeholder="conduct research"></textarea><button class="primary" onclick="add()">保存单词</button></div><div class="panel"><h2>批量导入</h2><p class="muted">每行一个单词，格式：英文 | 中文 | 例句（例句可省略）</p><textarea id="bulk" rows="6" placeholder="effective | 有效的 | an effective method"></textarea><button onclick="bulkAdd()">导入这些单词</button></div><div class="panel"><h2>数据备份</h2><div class="row"><button onclick="exportData()">导出 JSON 备份</button><button onclick="document.getElementById('file').click()">导入 JSON 备份</button></div><input type="file" id="file" accept=".json,application/json" style="display:none" onchange="importData(event)"><p class="muted">换手机或清除浏览器数据前，请先导出备份。</p></div></section></main><div id="toast"></div><script>
const seed=[['precede','在……之前发生；先于'],['process','过程；处理'],['recession','经济衰退'],['reduction','减少；降低'],['reduce','减少；降低'],['productive','富有成效的；多产的'],['production','生产'],['produce','生产；产生'],['product','产品'],['conduct','进行；实施；行为','conduct research'],['reproduce','复制；繁殖'],['policy','政策'],['effective','有效的'],['ineffective','无效的'],['prefer','更喜欢'],['preference','偏好；优先选择'],['reference','参考；提及'],['independent','独立的'],['essential','必不可少的；本质的'],['indispensable','不可或缺的'],['compensate','补偿'],['pension','养老金'],['expense','费用；开支'],['expose','暴露；揭露'],['experience','经验；经历','learn from experience'],['conclusion','结论','draw a conclusion'],['research','研究','conduct research'],['result','结果','produce results'],['claim','声称；主张'],['cost','成本；花费','reduce costs'],['effort','努力'],['benefit','益处；受益'],['impact','影响；冲击'],['significant','显著的；重要的'],['improvement','改善；提高'],['improve','改善；提高'],['gradually','逐渐地'],['condition','状况；条件'],['treatment','治疗；处理'],['introduce','介绍；引入'],['instrument','仪器；工具'],['initial','最初的'],['initially','最初；起初'],['patient','病人；有耐心的'],['medical','医疗的'],['regular','规律的；定期的'],['routine','常规；例行的'],['discussion','讨论'],['discuss','讨论'],['debate','辩论；争论'],['controversy','争议'],['resist','抵抗；抵制'],['resistance','抵抗；阻力'],['divorce','离婚'],['advisable','明智的；可取的'],['adversary','对手；敌手'],['invisible','看不见的'],['visible','可见的'],['decision','决定'],['decide','决定'],['risk','风险'],['consider','考虑'],['couple','一对；夫妻'],['marriage','婚姻'],['increase','增加'],['decrease','减少'],['recent','最近的'],['recently','最近'],['exercise','锻炼；练习'],['advantage','优势'],['disadvantage','劣势'],['division','划分；部门'],['civil','公民的；民事的'],['exclusive','独有的；排他的'],['excavate','挖掘'],['assume','假设；认为'],['successful','成功的'],['judgment','判断力'],['repeat','重复'],['mistake','错误'],['fail','失败；未能做到'],['generate','产生；生成'],['alone','单独地；仅仅'],['rather','相当；宁愿'],['progress','进展'],['develop','发展；开发'],['development','发展'],['require','需要；要求'],['outweigh','超过；胜过'],['almost','几乎'],['hardly','几乎不'],['even','甚至'],['eventual','最终的'],['eventually','最终'],['device','设备；装置'],['method','方法'],['researcher','研究人员'],['scientist','科学家'],['doctor','医生'],['medicine','药物；医学'],['study','学习；研究'],['test','测试'],['theory','理论'],['consecutive','连续的'],['procedure','程序；步骤'],['connect','连接'],['connection','联系；连接']];
const KEY='fanci_words_v1';let words;try{let x=JSON.parse(localStorage.getItem(KEY));words=Array.isArray(x)?x:seed.map(([en,zh,note])=>({en,zh,note:note||'',weak:0,correct:0}));}catch(e){words=seed.map(([en,zh,note])=>({en,zh,note:note||'',weak:0,correct:0}));}let queue=[],index=0,turned=false,direction='zh';function save(){localStorage.setItem(KEY,JSON.stringify(words));document.getElementById('count').textContent=words.length+' 词';}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function tab(id){for(let s of document.querySelectorAll('section'))s.hidden=s.id!==id;if(id==='words')renderList()}function start(){queue=words.map((_,i)=>i).filter(i=>document.getElementById('filter').value==='all'||words[i].weak>0);for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}index=0;show()}function show(){turned=false;let w=words[queue[index]];document.getElementById('progress').textContent=queue.length?`${Math.min(index+1,queue.length)} / ${queue.length}`:'0 / 0';if(!w){document.getElementById('face').textContent=queue.length?'本轮完成 🎉':'暂无单词';document.getElementById('hint').textContent='可添加单词或重新洗牌';return}let m=document.getElementById('mode').value;direction=m==='random'?(Math.random()<.5?'zh':'en'):m;document.getElementById('face').textContent=w[direction];document.getElementById('hint').textContent='点击翻面查看答案'}function flip(){let w=words[queue[index]];if(!w)return;turned=!turned;document.getElementById('face').textContent=w[turned?(direction==='zh'?'en':'zh'):direction];document.getElementById('hint').textContent=turned?(w.note||'点击再次翻回'):'点击翻面查看答案'}function grade(ok){let w=words[queue[index]];if(!w)return;if(ok){w.correct=(w.correct||0)+1;w.weak=Math.max(0,(w.weak||0)-1)}else w.weak=(w.weak||0)+1;save();index++;show()}function speak(){let w=words[queue[index]];if(!w)return;let u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}function add(){let en=document.getElementById('english').value.trim(),zh=document.getElementById('chinese').value.trim(),note=document.getElementById('note').value.trim();if(!en||!zh)return toast('请填写英文和中文');upsert(en,zh,note);['english','chinese','note'].forEach(x=>document.getElementById(x).value='');save();start();toast('已保存')}function upsert(en,zh,note=''){let w=words.find(x=>x.en.toLowerCase()===en.toLowerCase());if(w){w.zh=zh;w.note=note||w.note}else words.push({en,zh,note,weak:0,correct:0})}function bulkAdd(){let n=0;for(let line of document.getElementById('bulk').value.split('\n')){let [en,zh,note]=line.split('|').map(x=>x.trim());if(en&&zh){upsert(en,zh,note);n++}}save();start();document.getElementById('bulk').value='';toast('已导入 '+n+' 行')}function renderList(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('wordlist').innerHTML='';for(let w of words.filter(w=>(w.en+w.zh).toLowerCase().includes(q))){let d=document.createElement('div');d.className='item';let b=document.createElement('b');b.textContent=w.en+' · '+w.zh;d.appendChild(b);let p=document.createElement('div');p.className='muted';p.textContent=(w.note||'')+(w.weak?' · 薄弱 ×'+w.weak:'');d.appendChild(p);let r=document.createElement('div');r.className='row';let edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{let en=prompt('英文',w.en);if(en===null)return;let zh=prompt('中文',w.zh);if(zh===null)return;let note=prompt('例句/备注',w.note||'');w.en=en.trim()||w.en;w.zh=zh.trim()||w.zh;w.note=note===null?w.note:note;save();renderList();start()};let del=document.createElement('button');del.textContent='删除';del.onclick=()=>{if(confirm('删除 '+w.en+'？')){words.splice(words.indexOf(w),1);save();renderList();start()}};r.append(edit,del);d.appendChild(r);document.getElementById('wordlist').appendChild(d)}}function exportData(){let blob=new Blob([JSON.stringify({app:'翻词',version:1,exportedAt:new Date().toISOString(),words},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='翻词备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function importData(e){try{let data=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(data)?data:data.words;if(!Array.isArray(arr)||!arr.every(x=>typeof x.en==='string'&&typeof x.zh==='string'))throw Error();if(!confirm('将导入 '+arr.length+' 个单词，合并同名词条，继续？'))return;for(let w of arr){let old=words.find(x=>x.en.toLowerCase()===w.en.toLowerCase());if(old)Object.assign(old,w);else words.push(w)}save();start();toast('导入成功')}catch(err){toast('文件格式不正确')}e.target.value=''}save();start();</script></body></html>
